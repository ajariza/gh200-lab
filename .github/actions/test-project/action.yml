name: Test project
description: Instala, prueba y compila
inputs:
  node-version:
    required: false
    default: '22'
outputs:
  result:
    description: Resultado de la acción
    value: ${{ steps.result.outputs.result }}
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
    - name: Instalar dependencias
      run: npm install
      shell: bash
    - name: Instalar dependencias
      run: npm ci
      shell: bash
    - name: Ejecutar tests
      run: npm test
      shell: bash
    - name: Compilar proyecto
      run: npm run build
      shell: bash
    - name: Generar resultado
      id: result
      run: echo "result=ok" >> "$GITHUB_OUTPUT"
      shell: bash