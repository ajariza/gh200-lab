name: R6 - GitHub ENV OUTPUT SUMMARY

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Calcular versión
        id: version
        run: |
          VERSION="1.0.${{ github.run_number }}"

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Comprobar variable de entorno
        run: |
          echo "Versión desde GITHUB_ENV: $BUILD_VERSION"

      - name: Crear resumen
        run: |
          echo "## Resultado R6" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Versión: **$BUILD_VERSION**" >> "$GITHUB_STEP_SUMMARY"
          echo "- Commit: \`${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Workflow: ${{ github.workflow }}" >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Mostrar versión recibida
        run: |
          echo "Versión recibida desde build: ${{ needs.build.outputs.version }}"          