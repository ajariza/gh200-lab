name: GitHub Script

on:
  workflow_dispatch:
  issues:
    types: [opened]

permissions:
  contents: read
  
jobs:
  script:
    runs-on: ubuntu-latest

    steps:
      - name: Ejecutar GitHub Script
        uses: actions/github-script@v7
        with:
          script: |
            core.info(`Owner: ${context.repo.owner}`)
            core.info(`Repo: ${context.repo.repo}`)
            core.info(`Repo completo: ${context.repo.owner}/${context.repo.repo}`)

      - name: Etiquetar issue GH200
        if: contains(github.event.issue.title, 'GH200')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: ['gh200-lab']
            })

      - name: Comentar issue GH200
        if: contains(github.event.issue.title, 'GH200')
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: 'Issue recibido por el laboratorio GH-200'
            })