name: P2M3_6 - Información de runners

on:
  workflow_dispatch:

jobs:
  runner-info:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Mostrar información del runner
        run: |
          echo "Sistema operativo: ${{ runner.os }}"
          echo "Arquitectura: ${{ runner.arch }}"
          node --version

      - name: Mostrar herramientas disponibles
        run: |
          git --version
          node --version
          npm --version
          python --version
          docker --version