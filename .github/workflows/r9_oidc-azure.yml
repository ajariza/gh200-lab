name: R9 - Azure OIDC

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  azure-login:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login en Azure mediante OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Verificar identidad
        run: |
          az account show