name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main
env:
  APP_NAME: gh200-lab
  
jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: [20, 22]

    steps:
      - name: Mostrar aplicación
        run: |
            echo "Aplicación: $APP_NAME"

      - name: Preparar versión de build
        run: |
            echo "BUILD_VERSION=1.0.${{ github.run_number }}" >> "$GITHUB_ENV"

      - name: Mostrar versión de build
        run: |
            echo "Versión generada: $BUILD_VERSION"
      
      - name: Publicar versión como output
        id: version
        run: |
            echo "value=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Mostrar output de versión
        run: |
            echo "Versión desde output: ${{ steps.version.outputs.value }}"

      - name: Mostrar contextos de GitHub
        run: |
            echo "Referencia: ${{ github.ref }}"
            echo "Commit SHA: ${{ github.sha }}"
            echo "Sistema operativo: ${{ runner.os }}"
      
      - name: Generar información de build
        run: |
            echo "APP_NAME=$APP_NAME" > build-info.txt
            echo "BUILD_VERSION=$BUILD_VERSION" >> build-info.txt
            echo "GITHUB_REF=${{ github.ref }}" >> build-info.txt
            echo "GITHUB_SHA=${{ github.sha }}" >> build-info.txt
            echo "RUNNER_OS=${{ runner.os }}" >> build-info.txt

      - name: Subir información de build
        uses: actions/upload-artifact@v4
        with:
            name: build-info
            path: build-info.txt

      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

      - name: Ejecutar build
        run: npm run build

      - name: Generar artefacto de build
        run: |
            mkdir -p dist
            echo "Aplicación: $APP_NAME" > dist/build.txt
            echo "Versión: $BUILD_VERSION" >> dist/build.txt
            echo "Node: ${{ matrix.node }}" >> dist/build.txt
            echo "Commit: ${{ github.sha }}" >> dist/build.txt

      - name: Subir artefacto de build
        uses: actions/upload-artifact@v4
        with:
            name: app-build-node-${{ matrix.node }}
            path: dist/       
            retention-days: 7     
 
  consume:
    needs: ci
    runs-on: ubuntu-latest

    steps:
      - name: Confirmar inicio del job consumidor
        run: |
          echo "El job consume empieza después de terminar CI"

      - name: Descargar artefacto de Node 20
        uses: actions/download-artifact@v5
        with:
            name: app-build-node-20
            path: dist

      - name: Mostrar contenido del artefacto
        run: |
            cat dist/build.txt