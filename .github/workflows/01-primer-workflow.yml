name: Primer workflow GH-200

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'package*.json'

  pull_request:
    branches:
      - main

  workflow_dispatch:
    inputs:
        environment:
            description: 'Entorno de ejecución'
            required: true
            type: choice
            options:
             - test
             - pre

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test
  info:
    needs: validate
    runs-on: ubuntu-latest

    steps:
     - name: Mostrar información del runner
       run: |
            pwd
            node --version
            echo "$GITHUB_WORKSPACE"        
            
     - name: Mostrar entorno seleccionado
       run: | 
            echo "Entorno seleccionado: ${{ inputs.environment }}"