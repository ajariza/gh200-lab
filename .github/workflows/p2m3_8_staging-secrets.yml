name: P2M3_8 - Staging secrets

on:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  staging-demo:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Mostrar variable no sensible
        run: |
          echo "URL de servicio: ${{ vars.DEMO_URL }}"

      - name: Usar secrets sin mostrarlos
        env:
          DEMO_API_KEY: ${{ secrets.DEMO_API_KEY }}
          STAGING_KEY: ${{ secrets.STAGING_KEY }}
        run: |
          if [ -n "$DEMO_API_KEY" ]; then
            echo "DEMO_API_KEY disponible"
          fi

          if [ -n "$STAGING_KEY" ]; then
            echo "STAGING_KEY disponible"
          fi

      - name: Comprobar secret inexistente
        env:
          SECRET_INEXISTENTE: ${{ secrets.NO_EXISTE }}
        run: |
          if [ -z "$SECRET_INEXISTENTE" ]; then
            echo "El secret inexistente se ha resuelto como cadena vacía"
          else
            echo "El secret contiene un valor"
          fi