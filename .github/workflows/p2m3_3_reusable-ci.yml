name: P2M3_3 - Reusable CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Versión de Node.js
        required: false
        type: string
        default: '22'

      run-build:
        description: Ejecutar build del proyecto
        required: false
        type: boolean
        default: false

    secrets:
      DEMO_REUSABLE_SECRET:
        required: false

    outputs:
      version:
        description: Versión generada por el workflow
        value: ${{ jobs.test.outputs.version }}

jobs:
  test:
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar tests
        run: npm test

      - name: Ejecutar build
        if: ${{ inputs.run-build }}
        run: npm run build

      - name: Generar versión
        id: version
        run: echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Comprobar secret recibido
        shell: bash
        env:
          DEMO_REUSABLE_SECRET: ${{ secrets.DEMO_REUSABLE_SECRET }}
        run: |
          if [ -n "$DEMO_REUSABLE_SECRET" ]; then
            echo "Secret recibido correctamente"
          else
            echo "Secret no configurado"
          fi        